<!doctype html>
<html class="no-js" lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Vue.js</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <main>
        <h1>Hola mundo con Vue</h1>
        
        <input type="text" v-model="nuevaFruta" placeholder="Agregar fruta" @keyup.enter.space="agregarFruta">
        <button @click="agregarFruta">Agregar</button>

        <ul>
            <li v-for="fruta in frutas">
                <input type="text" v-model="fruta.cantidad"></input> {{ fruta.nombre}} <button @click="fruta.cantidad++">+</button>
                <span v-if="fruta.cantidad == 0"> - Sin stock</span>
            </li>
        </ul>
            <h2>TOTAL: {{totalFrutas}}</h2>
    </main>
    

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    
    <script src="js/main.js"></script>
</body>

</html>
